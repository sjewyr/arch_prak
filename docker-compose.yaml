services:
  redis:
    image: redis:latest
    container_name: redis_container
    restart: on-failure
    ports:
      - "6379:6379"
    volumes:
      - ./data/redis:/data    

  mongodb:
    image: mongo:latest
    container_name: mongodb_container
    restart: on-failure
    ports:
      - "27017:27017"
    volumes:
      - ./data/mongodbData:/data/db
      - ./data/mongodbJournal:/data/journal
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${SERVICE_USERNAME}
      MONGO_INITDB_ROOT_PASSWORD: ${SERVICE_PASSWORD}
      MONGO_REPLICA_SET_NAME: rs0  # Добавлено для CDC
    command: 
      - mongod
      - --replSet
      - rs0  # Имя Replica Set
      - --bind_ip_all  # Разрешаем подключения с любого IP
    healthcheck:
      test: echo 'db.runCommand("ping").ok' | mongosh admin --quiet
      interval: 5s
      timeout: 10s
      retries: 5
  mongo-init:
    image: mongo:latest
    depends_on:
      mongodb:
        condition: service_healthy
    restart: on-failure
    command: >
      bash -c "
        if ! mongosh --host mongodb_container --eval 'rs.status().ok' --quiet | grep -q 1; then
          echo 'Initializing Replica Set...';
          mongosh --host mongodb_container --eval 'rs.initiate({_id: \"rs0\", members: [{_id: 0, host: \"mongodb_container:27017\"}]})';
        else
          echo 'Replica Set already initialized';
        fi
      "
    

  neo4j:
    image: neo4j:latest
    container_name: neo4j_container
    restart: on-failure
    ports:
      - "7474:7474"
      - "7687:7687"
    environment:
      - NEO4J_AUTH=neo4j/password
    volumes:
      - ./data/neo4j:/data
   
  elasticsearch:
    image: bitnami/elasticsearch:8.17.0
    container_name: elasticsearch_container
    restart: on-failure
    environment:
      - discovery.type=single-node
      - ELASTIC_PASSWORD=password
      - ES_JAVA_OPTS=-Xms512m -Xmx512m  
      - xpack.security.enabled=false
      - xpack.security.http.ssl.enabled=false
    ports:
      - "9200:9200"
      - "9300:9300"
    volumes:
      - ./data/elasticsearch:/usr/share/elasticsearch/data

  postgresql:
    image: debezium/postgres:17-alpine
    container_name: postgresql_container
    restart: on-failure
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres
      - POSTGRES_DB=postgres
    command: 
      - "postgres"
      - "-c"
      - "wal_level=logical"
    ports:
      - "5432"
    volumes:
      - ./data/postgresql:/var/lib/postgresql/data 

  pgadmin:
    image: elestio/pgadmin:latest
    container_name: pgadmin
    restart: always
    ports:
      - "5050:80"
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@admin.com
      PGADMIN_DEFAULT_PASSWORD: admin
  

  gateway:
    build:
      context: .
      dockerfile: Dockerfile.Gateway
    container_name: gateway
    ports:
      - "80:10000"
    volumes:
      - ./gateway:/gateway
    environment:
      - PYTHONUNBUFFERED=1
    restart: unless-stopped
    depends_on:
    - api1
    - api2
    - api3

  api1:
    build:
      context: .
      dockerfile: Dockerfile.Api
    container_name: api1
    ports:
      - "10000"
    volumes:
      - ./api:/api
    environment:
      - PYTHONUNBUFFERED=1
      - LAB_NUM=1
    restart: unless-stopped
    depends_on:
      - sync

  api2:
    build:
      context: .
      dockerfile: Dockerfile.Api
    container_name: api2
    ports:
      - "10000"
    volumes:
      - ./api:/api
    environment:
      - PYTHONUNBUFFERED=1
      - LAB_NUM=2
    restart: unless-stopped
    depends_on:
      - sync

  api3:
    build:
      context: .
      dockerfile: Dockerfile.Api
    container_name: api3
    ports:
      - "10000"
    volumes:
      - ./api:/api
    environment:
      - PYTHONUNBUFFERED=1
      - LAB_NUM=3
    restart: unless-stopped
    depends_on:
      - sync
      
  sync:
    build:
      context: .
      dockerfile: Dockerfile.Sync
    container_name: sync
    ports:
      - "82:10000"
    volumes:
      - ./sync:/sync
      - ./FINISH.sql:/FINISH.sql
    environment:
      - PYTHONUNBUFFERED=1
      - CREATE_DATA=1
    restart: "no"
    depends_on:
      - postgresql
      - neo4j
      - redis
      - elasticsearch
      - mongodb
  zookeeper:
      image: confluentinc/cp-zookeeper:7.4.1
      container_name: zookeeper
      ports:
        - "2181:2181"
      environment:
        ZOOKEEPER_CLIENT_PORT: 2181
        ZOOKEEPER_TICK_TIME: 2000
      restart: unless-stopped
  kafka:
    image: confluentinc/cp-kafka:7.4.1
    container_name: kafka
    depends_on:
      - zookeeper
    ports:
      - "9092:9092"
      - "29092:29092"
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092,PLAINTEXT_HOST://localhost:29092
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
    restart: unless-stopped
  schema-registry:
    image: confluentinc/cp-schema-registry:7.4.1
    container_name: schema-registry
    depends_on:
      - kafka
    ports:
      - "8081:8081"
    environment:
      SCHEMA_REGISTRY_KAFKASTORE_BOOTSTRAP_SERVERS: kafka:9092
      SCHEMA_REGISTRY_HOST_NAME: schema-registry
    restart: unless-stopped
  kafka-connect:
    image: confluentinc/cp-kafka-connect:7.4.1
    container_name: kafka-connect
    depends_on:
      - kafka
      - schema-registry
    ports:
      - "8083:8083"
    environment:
      CONNECT_BOOTSTRAP_SERVERS: kafka:9092
      CONNECT_REST_ADVERTISED_HOST_NAME: kafka-connect
      CONNECT_GROUP_ID: compose-connect-group
      CONNECT_CONFIG_STORAGE_TOPIC: docker-connect-configs
      CONNECT_OFFSET_STORAGE_TOPIC: docker-connect-offsets
      CONNECT_STATUS_STORAGE_TOPIC: docker-connect-status
      CONNECT_KEY_CONVERTER: io.confluent.connect.avro.AvroConverter
      CONNECT_VALUE_CONVERTER: io.confluent.connect.avro.AvroConverter
      CONNECT_KEY_CONVERTER_SCHEMA_REGISTRY_URL: http://schema-registry:8081
      CONNECT_VALUE_CONVERTER_SCHEMA_REGISTRY_URL: http://schema-registry:8081
      CONNECT_PLUGIN_PATH: "/usr/share/java,/usr/share/confluent-hub-components"
    volumes:
      - ./connectors:/usr/share/confluent-hub-components
    restart: unless-stopped
  control-center:
    image: confluentinc/cp-enterprise-control-center:7.4.1
    container_name: control-center
    depends_on:
      - kafka
      - schema-registry
      - kafka-connect
    ports:
      - "9021:9021"
    environment:
      CONTROL_CENTER_BOOTSTRAP_SERVERS: kafka:9092
      CONTROL_CENTER_SCHEMA_REGISTRY_URL: http://schema-registry:8081
      CONTROL_CENTER_CONNECT_CLUSTER: http://kafka-connect:8083
    restart: unless-stopped