services:
  redis:
    image: redis:latest
    container_name: redis_container
    restart: on-failure
    ports:
      - "6379:6379"
    volumes:
      - ./data/redis:/data    

  mongodb:
    image: mongo:latest
    container_name: mongodb_container
    restart: on-failure
    ports:
      - "27017:27017"
    volumes:
      - ./data/mongodbData:/data/db
      - ./data/mongodbJournal:/data/journal
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${SERVICE_USERNAME}
      MONGO_INITDB_ROOT_PASSWORD: ${SERVICE_PASSWORD}
    

  neo4j:
    image: neo4j:latest
    container_name: neo4j_container
    restart: on-failure
    ports:
      - "7474:7474"
      - "7687:7687"
    environment:
      - NEO4J_AUTH=neo4j/password
    volumes:
      - ./data/neo4j:/data
   
  elasticsearch:
    image: bitnami/elasticsearch:8.17.0
    container_name: elasticsearch_container
    restart: on-failure
    environment:
      - discovery.type=single-node
      - ELASTIC_PASSWORD=password
      - ES_JAVA_OPTS=-Xms512m -Xmx512m  
      - xpack.security.enabled=false
      - xpack.security.http.ssl.enabled=false
    ports:
      - "9200:9200"
      - "9300:9300"
    volumes:
      - ./data/elasticsearch:/usr/share/elasticsearch/data

  postgresql:
    image: postgres:latest
    container_name: postgresql_container
    restart: on-failure
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres
      - POSTGRES_DB=postgres
    ports:
      - "5432"
    volumes:
      - ./data/postgresql:/var/lib/postgresql/data 

  pgadmin:
    image: elestio/pgadmin:latest
    container_name: pgadmin
    restart: always
    ports:
      - "5050:80"
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@admin.com
      PGADMIN_DEFAULT_PASSWORD: admin
  

  gateway:
    build:
      context: .
      dockerfile: Dockerfile.Gateway
    container_name: gateway
    ports:
      - "80:10000"
    volumes:
      - ./gateway:/gateway
    environment:
      - PYTHONUNBUFFERED=1
    restart: unless-stopped
    depends_on:
    - api1
    - api2
    - api3

  api1:
    build:
      context: .
      dockerfile: Dockerfile.Api
    container_name: api1
    ports:
      - "10000"
    volumes:
      - ./api:/api
    environment:
      - PYTHONUNBUFFERED=1
      - LAB_NUM=1
    restart: unless-stopped
    depends_on:
      - sync

  api2:
    build:
      context: .
      dockerfile: Dockerfile.Api
    container_name: api2
    ports:
      - "10000"
    volumes:
      - ./api:/api
    environment:
      - PYTHONUNBUFFERED=1
      - LAB_NUM=2
    restart: unless-stopped
    depends_on:
      - sync

  api3:
    build:
      context: .
      dockerfile: Dockerfile.Api
    container_name: api3
    ports:
      - "10000"
    volumes:
      - ./api:/api
    environment:
      - PYTHONUNBUFFERED=1
      - LAB_NUM=3
    restart: unless-stopped
    depends_on:
      - sync
      
  sync:
    build:
      context: .
      dockerfile: Dockerfile.Sync
    container_name: sync
    ports:
      - "82:10000"
    volumes:
      - ./sync:/sync
      - ./FINISH.sql:/FINISH.sql
    environment:
      - PYTHONUNBUFFERED=1
      - CREATE_DATA=1
    restart: "no"
    depends_on:
      - postgresql
      - neo4j
      - redis
      - elasticsearch
      - mongodb